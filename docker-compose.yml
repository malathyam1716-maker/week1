version: '3.8'

x-airflow-common:
  &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=FB1o_Dh2ed4Co1155Gb5SSg237e1b5853b0193bb444=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    # Map the app data warehouse environment variables
    - DEV_DATABASE_URL=postgresql+psycopg2://dw_user:dw_pass@postgres/data_warehouse
    - DEV_STRIPE_API_KEY=${DEV_STRIPE_API_KEY:-""}
    - DEV_SALESFORCE_ENDPOINT=${DEV_SALESFORCE_ENDPOINT:-""}
    - DEV_SALESFORCE_ACCESS_TOKEN=${DEV_SALESFORCE_ACCESS_TOKEN:-""}
    - DEV_ZENDESK_ENDPOINT=${DEV_ZENDESK_ENDPOINT:-""}
    - DEV_ZENDESK_ACCESS_TOKEN=${DEV_ZENDESK_ACCESS_TOKEN:-""}
    - DEV_AWS_ACCESS_KEY_ID=${DEV_AWS_ACCESS_KEY_ID:-""}
    - DEV_AWS_SECRET_ACCESS_KEY=${DEV_AWS_SECRET_ACCESS_KEY:-""}
    - DEV_AWS_S3_BUCKET_NAME=${DEV_AWS_S3_BUCKET_NAME:-""}
    - DEV_SLACK_WEBHOOK_URL=${DEV_SLACK_WEBHOOK_URL:-""}
    - DEV_ALERT_EMAIL=${DEV_ALERT_EMAIL:-""}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize multiple databases (airflow and data_warehouse)
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: version
    entrypoint: /bin/bash
    # Run database initialization
    command: -c "airflow db init && airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.com --password admin"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

volumes:
  postgres_data:
