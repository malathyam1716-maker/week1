name: Enterprise ETL CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Optional: Postgres container for integration testing, but unit tests will run on sqlite
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dw_user
          POSTGRES_PASSWORD: dw_pass
          POSTGRES_DB: data_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Tests
      env:
        DEV_DATABASE_URL: postgresql+psycopg2://dw_user:dw_pass@localhost:5432/data_warehouse
      run: |
        python -m pytest
